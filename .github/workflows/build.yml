name: Build & release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  engine-tests:
    name: Native engine tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run engine tests
        run: |
          cmake -S android/engine-tests -B build/engine-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine-tests -j
          TMPDIR=$RUNNER_TEMP build/engine-tests/engine_test

  backend-tests:
    name: Separation server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        run: pytest -q

  model:
    name: On-device AI model (export + verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache model
        id: cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models/htdemucs.onnx
          key: htdemucs-onnx-${{ hashFiles('tools/model/*.py', 'tools/model/requirements.txt') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with: { python-version: "3.11" }
      - name: Export & verify against PyTorch Demucs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r tools/model/requirements.txt onnxscript
          WORK=$RUNNER_TEMP/model tools/model/build_model.sh
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: android/app/src/main/assets/models/htdemucs.onnx
          retention-days: 3

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: [engine-tests, model]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: android/app/src/main/assets/models
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install SDK packages (runner ships the Android SDK)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Version
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            T="${{ github.event.inputs.release_tag }}"
            echo "PHASE_VERSION_NAME=${T#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=$T" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PHASE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "PHASE_VERSION_NAME=0.2.0-dev.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi
          echo "PHASE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PHASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "PHASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "PHASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PHASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PHASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::No signing secrets: using the public sideload key. Do not upload this AAB to Google Play."
          fi
      - name: Tests
        working-directory: android
        # Retries cover transient plugin/dependency download failures on runners.
        run: |
          for i in 1 2 3; do ./gradlew --no-daemon :app:testDebugUnitTest :separation:test && exit 0; sleep 30; done; exit 1
      - name: Release APKs (per ABI) + App Bundle
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PabiSplits=true
          ./gradlew --no-daemon :app:bundleRelease
      - name: Collect
        run: |
          mkdir -p dist
          V=$PHASE_VERSION_NAME
          A=android/app/build/outputs
          cp $A/apk/release/app-arm64-v8a-release.apk   dist/Phase-$V-arm64-v8a.apk
          cp $A/apk/release/app-armeabi-v7a-release.apk dist/Phase-$V-armeabi-v7a.apk
          cp $A/bundle/release/app-release.aab          dist/Phase-$V.aab
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: phase-release
          path: dist/*
      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phase ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

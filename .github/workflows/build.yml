name: Build & release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  engine-tests:
    name: Native engine tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run engine tests
        run: |
          cmake -S android/engine-tests -B build/engine-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine-tests -j
          TMPDIR=$RUNNER_TEMP build/engine-tests/engine_test

  backend-tests:
    name: Separation server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        run: pytest -q

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [engine-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install SDK packages (runner ships the Android SDK)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Version from tag
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            T="${{ github.event.inputs.release_tag }}"
            echo "PHASE_VERSION_NAME=${T#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=$T" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PHASE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
          else
            echo "PHASE_VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi
          echo "PHASE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PHASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "PHASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "PHASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PHASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PHASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No signing secrets: using the public sideload key in android/keystore/"
          fi
      - name: Unit tests + release build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Phase-${PHASE_VERSION_NAME}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase-apk
          path: dist/*
      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Phase ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
